name: 'Build kernel run selftests via vmtest'

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        default: 'ubuntu-24.04'
        type: string
      arch:
        description: 'what arch to test'
        required: true
        default: 'x86_64'
        type: string
      kernel:
        description: 'kernel version or LATEST'
        required: true
        default: 'LATEST'
        type: string
      pahole:
        description: 'pahole rev or branch'
        required: false
        default: 'master'
        type: string
      llvm-version:
        description: 'llvm version'
        required: false
        default: '22'
        type: string
      cc:
        description: 'compiler'
        required: true
        type: string
      lto:
        description: 'kernel LTO mode (none or thin; thin requires clang)'
        required: false
        default: 'none'
        type: string

jobs:
  vmtest:
    name: pahole-${{ inputs.cc }}${{ inputs.lto != 'none' && format('-lto-{0}', inputs.lto) || '' }}@${{ inputs.arch }}
    runs-on: ${{ inputs.runs_on }}
    steps:

      - uses: actions/checkout@v4

      - name: Setup environment
        uses: libbpf/ci/setup-build-env@v3
        with:
          pahole: ${{ inputs.pahole }}
          arch: ${{ inputs.arch }}
          llvm-version: ${{ inputs.llvm-version }}

      - name: Build,install current pahole
        shell: bash
        env:
          CC: ${{ inputs.cc }}
          LLVM_VERSION: ${{ inputs.llvm-version}}
        run: .github/scripts/build-pahole.sh

      - name: Get kernel source
        shell: bash
        timeout-minutes: 60
        run: .github/scripts/get-kernel-source.sh

      - name: Configure, build kernel with current pahole
        shell: bash
        env:
          CC: ${{ inputs.cc }}
          LLVM_VERSION: ${{ inputs.llvm-version }}
          LTO: ${{ inputs.lto }}
        run: .github/scripts/build-kernel.sh

      - name: Run selftests
        shell: bash
        env:
          # ThinLTO vmlinux is large; limit how many tests load it at once.
          SELFTEST_JOBS: ${{ inputs.lto != 'none' && '2' || '' }}
        run: .github/scripts/run-selftests.sh

      - name: Compare functions generated
        shell: bash
        env:
          CC: ${{ inputs.cc }}
          LLVM_VERSION: ${{ inputs.llvm-version }}
        run: .github/scripts/compare-functions.sh

